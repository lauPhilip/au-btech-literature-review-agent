# Weekly update proposals for NuGet packages, npm (Tailwind) and the pinned
# GitHub Actions. Each update arrives as a pull request, so CI runs before anything changes.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/AuBtechReviewAgent"
    schedule:
      interval: "weekly"
    ignore:
      # Tailwind 4 is a rewrite (new CLI package, CSS-based config); moving to it is a deliberate job, not a
      # routine bump. Minor and patch updates of Tailwind 3 still come through.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
