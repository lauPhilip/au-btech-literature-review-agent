name: CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Least privilege for the default token. Third-party actions are pinned to a full commit SHA (the tag is in
# the comment), so a moved or hijacked tag cannot change what runs here; Dependabot proposes updates.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AuBtechReviewAgent.sln

      - name: Build
        run: dotnet build AuBtechReviewAgent.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AuBtechReviewAgent.sln --configuration Release --no-build --verbosity normal

  css-up-to-date:
    name: Compiled CSS matches the components
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AuBtechReviewAgent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # wwwroot/css/tailwind.css is committed. If a component uses a class that is not in it, this fails:
      # run "npm ci && npm run build:css" in AuBtechReviewAgent and commit the result.
      - name: Rebuild Tailwind CSS and compare
        run: |
          npm ci
          npm run build:css
          git diff --exit-code -- wwwroot/css/tailwind.css

  deploy:
    name: Deploy to Simply
    needs: [ build-and-test, css-up-to-date ]
    # Runs only on a push to master (a merged PR), and only once you switch it on with a repository variable
    # DEPLOY_ENABLED = true (Settings -> Secrets and variables -> Actions -> Variables). Until then it is skipped.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Never run two deploys at the same time; a newer push waits for the running one.
    concurrency:
      group: deploy-simply
      cancel-in-progress: false
    env:
      # Simply.com ASP hosting is Windows/IIS with only .NET Framework installed, so the app is published
      # self-contained for win-x86, and reaches the server over FTPS (SSH exists only on Simply's PHP hosting).
      FTP_HOST: ${{ vars.SIMPLY_FTP_HOST || 'ftp.simply.com' }}
      REMOTE_DIR: ${{ vars.SIMPLY_REMOTE_DIR || '/public_html' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish (self-contained, win-x86)
        run: |
          dotnet publish AuBtechReviewAgent/AuBtechReviewAgent.csproj --configuration Release \
            --runtime win-x86 --self-contained true -o ./publish
          # The server keeps its own web.config, which holds the API keys; never overwrite it.
          rm -f ./publish/web.config
          echo '<html><body><p>Updating, back in a minute.</p></body></html>' > app_offline.htm

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Add these repository secrets (Settings -> Secrets and variables -> Actions -> Secrets):
      #   SIMPLY_FTP_USER      - the FTP username from the Simply.com control panel
      #   SIMPLY_FTP_PASSWORD  - its password
      # 1) app_offline.htm stops the app so its files are not locked; 2) the new files are uploaded
      # (web.config, App_Data and WorkspaceStore on the server are left alone, and nothing is deleted there);
      # 3) app_offline.htm is removed, which starts the new version. If the upload fails, the site stays
      # on the "Updating" page rather than running a half-updated app; re-run the job or remove the file by FTP.
      - name: Upload to Simply over FTPS
        env:
          LFTP_PASSWORD: ${{ secrets.SIMPLY_FTP_PASSWORD }}
          FTP_USER: ${{ secrets.SIMPLY_FTP_USER }}
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            set net:timeout 30;
            open --env-password -u \"$FTP_USER\" \"$FTP_HOST\";
            cd \"$REMOTE_DIR\";
            put app_offline.htm;
            mirror --reverse --parallel=2 --verbose=1 --no-perms \
              --exclude-glob web.config --exclude-glob App_Data/ --exclude-glob WorkspaceStore/ \
              ./publish .;
            rm app_offline.htm
          "
