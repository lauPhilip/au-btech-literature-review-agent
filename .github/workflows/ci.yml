name: CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Least privilege for the default token. Third-party actions are pinned to a full commit SHA (the tag is in
# the comment), so a moved or hijacked tag cannot change what runs here; Dependabot proposes updates.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the whole history, so MinVer finds the last version tag

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AuBtechReviewAgent.sln

      - name: Build
        run: dotnet build AuBtechReviewAgent.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AuBtechReviewAgent.sln --configuration Release --no-build --verbosity normal

  css-up-to-date:
    name: Compiled CSS matches components
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AuBtechReviewAgent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the whole history, so MinVer finds the last version tag

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # wwwroot/css/tailwind.css is committed. If a component uses a class that is not in it, this fails:
      # run "npm ci && npm run build:css" in AuBtechReviewAgent and commit the result.
      - name: Rebuild Tailwind CSS and compare
        run: |
          npm ci
          npm run build:css
          git diff --exit-code -- wwwroot/css/tailwind.css

  release-check:
    name: Release check and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tests of tools/ReleaseCheck/release_check.py, which release.yml runs before it publishes a version. They
      # also check that CHANGELOG.md and CITATION.cff are well formed, so a mistake shows here and not on the
      # day of a release. Standard library only; the runner's Python is enough.
      - name: Test the release check
        run: python3 -m unittest discover -s tools/ReleaseCheck -v

  accessibility:
    name: Accessibility (axe-core, WCAG 2.2 AA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the whole history, so MinVer finds the last version tag

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # The app runs without real keys: the checked pages never call the model or the sources.
      - name: Start the app
        env:
          ASPNETCORE_ENVIRONMENT: Development
          MISTRAL_API_KEY: ci-placeholder
        run: |
          dotnet run --project AuBtechReviewAgent/AuBtechReviewAgent.csproj --no-launch-profile --urls http://localhost:5038 > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5038/ > /dev/null && exit 0; sleep 2; done
          cat app.log; exit 1

      # Fails on any "serious" or "critical" problem; the log lists every rule and element (tools/a11y).
      # Since redesign step 12 every page takes the dark theme, so the main pages are checked in it too.
      # /design/frame exists only in development: AppLayout in both themes.
      # /design/run, also development only, shows New review while a run is going, stopped and done, with sample figures.
      # /design/report, development only too, shows the report page with a made-up finished run (SampleReport).
      # /design/metrics, development only too, shows the Metrics page with made-up runs (SampleMetrics).
      - name: Run axe-core on the public pages
        working-directory: tools/a11y
        env:
          BASE_URL: http://localhost:5038
          A11Y_PAGES: /,/review,/spec-matrix,/start,/metrics,/about,/model-card,/privacy,/verify,/glossary,/not-found,/design/frame,/design/run,/design/run?state=stopped,/design/run?state=done,/design/report,/design/metrics
          A11Y_DARK_PAGES: /,/review,/start,/metrics,/about,/model-card,/privacy,/verify,/glossary,/not-found,/design/frame,/design/run,/design/run?state=done,/design/report,/design/metrics
          A11Y_SCREENSHOTS: ${{ github.workspace }}/a11y-screenshots
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node axe-check.mjs

      # "Print or save as PDF" (issue #153): the made-up report must flow over several A4 pages without the app's
      # frame, not stop at one screen. The PDF goes with the screenshots.
      - name: Print the report to PDF
        working-directory: tools/a11y
        env:
          BASE_URL: http://localhost:5038
          PRINT_PAGES: /design/report=3,/about=1
          PRINT_OUT: ${{ github.workspace }}/a11y-screenshots
        run: node print-check.mjs

      # Screenshots of every checked page at 390, 1440 and 1920 px, so a pull request that changes markup can be
      # looked at without running the app.
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-screenshots
          path: a11y-screenshots/
          if-no-files-found: ignore
          retention-days: 14

  # The deploy itself is in deploy.yml, which release.yml also calls once a version is published, so the
  # server then names the release and not a pre-release (#144).
  deploy:
    name: Deploy
    needs: [ build-and-test, css-up-to-date, accessibility ]
    # Runs only on a push to master (a merged PR), and only once you switch it on with a repository variable
    # DEPLOY_ENABLED = true (Settings -> Secrets and variables -> Actions -> Variables). Until then it is skipped.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets:
      SIMPLY_FTP_USER: ${{ secrets.SIMPLY_FTP_USER }}
      SIMPLY_FTP_PASSWORD: ${{ secrets.SIMPLY_FTP_PASSWORD }}
