# Publishing a version: see "Publishing a version" in CONTRIBUTING.md. In short, after CHANGELOG.md and
# CITATION.cff name the version on master, push an annotated tag whose message is the release's title:
#   git tag -a v0.1.0 -m "Research questions" && git push origin v0.1.0
# The release is titled "v0.1.0 - Research questions". Its notes are the version's section of CHANGELOG.md,
# followed by GitHub's list of merged pull requests and the link comparing it with the previous release.
# tools/ReleaseCheck/release_check.py stops the release, with the reason, if the tag is not a version or has no
# message, if CHANGELOG.md has no section for it, or if CITATION.cff's version or date-released does not match.
# (The Dockerfile is not built here: the app is deployed to Simply as a .NET app.) When the repository is linked
# to Zenodo (zenodo.org -> GitHub -> switch the repository on), every GitHub release is archived there with its
# own DOI, using the metadata in .zenodo.json.
name: Release

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: read

jobs:
  check:
    name: Check the tag, changelog and citation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the whole history, so MinVer finds the last version tag

      # The checkout can leave the tag as a plain pointer to the commit; fetching it again by name keeps the
      # annotated tag, with its message and date, which the title and the citation check need.
      - name: Fetch the annotated tag
        env:
          TAG: ${{ github.ref_name }}
        run: git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"

      - name: Check the release
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/ReleaseCheck/release_check.py "$TAG"

  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the whole history, so MinVer finds the last version tag
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test AuBtechReviewAgent.sln --configuration Release

  github-release:
    needs: [ check, test ]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the whole history, so MinVer finds the last version tag

      - name: Fetch the annotated tag
        env:
          TAG: ${{ github.ref_name }}
        run: git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"

      # The same check again, which also writes the title and the notes (the version's section of CHANGELOG.md).
      - name: Write the title and notes
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/ReleaseCheck/release_check.py "$TAG" --notes-out release-notes.md

      # --notes-file comes first and --generate-notes appends GitHub's list of merged pull requests and the
      # comparison link. A version with a pre-release part (v0.2.0-rc.1) is marked as a pre-release.
      - name: Create the GitHub release (Zenodo archives it when the integration is on)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ steps.release.outputs.title }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --title "$TITLE" --notes-file release-notes.md --generate-notes \
            --verify-tag "${flags[@]}"
