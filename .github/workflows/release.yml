# Publishing a version: push a tag such as v1.2.0.
#   git tag v1.2.0 && git push origin v1.2.0
# This tests the code and creates a GitHub release. (The Dockerfile is not built here: the app is deployed to
# Simply as a .NET app. Add a docker/build-push-action job if an image is wanted later.) When the repository is linked to
# Zenodo (zenodo.org -> GitHub -> switch the repository on), every GitHub release is archived there with its
# own DOI, using the metadata in .zenodo.json.
name: Release

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test AuBtechReviewAgent.sln --configuration Release

  github-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the GitHub release (Zenodo archives it when the integration is on)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes --verify-tag
