# Publishing a version: see "Publishing a version" in CONTRIBUTING.md. In short, after CHANGELOG.md and
# CITATION.cff name the version on master, push an annotated tag whose message is the release's title:
#   git tag -a v0.1.0 -m "Research questions" && git push origin v0.1.0
# The release is titled "v0.1.0 - Research questions". Its body is composed by tools/ReleaseCheck/release_body.py:
# a one-line summary, what the version means for your review, the version's section of CHANGELOG.md, how to cite
# it, GitHub's list of merged pull requests folded away and the link comparing it with the previous release.
# tools/ReleaseCheck/release_check.py stops the release, with the reason, if the tag is not a version or has no
# message, if CHANGELOG.md has no section for it, if CITATION.cff's version or date-released does not match, or if
# the notes score below 60 for Flesch Reading Ease or do not have exactly one emoji.
# Once the release is published, the tagged commit is deployed to the server through deploy.yml, if the tag is the
# newest version tag (tools/ReleaseCheck/newest_tag.py), so the server's build names the release (#144). This is
# the only automatic deploy: a merge into master does not deploy (#707).
# The same published release also pushes a Docker image to the GitHub container registry, tagged with the version
# and, for the newest stable version, `latest` (#776). The server itself is still deployed as a .NET app, not as
# this image. When the repository is linked to Zenodo (zenodo.org -> GitHub -> switch the repository on), every GitHub release is archived there with its
# own DOI, using the metadata in .zenodo.json.
name: Release

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: read

jobs:
  check:
    name: Check the tag, changelog and citation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the whole history, so MinVer finds the last version tag

      # The checkout can leave the tag as a plain pointer to the commit; fetching it again by name keeps the
      # annotated tag, with its message and date, which the title and the citation check need.
      - name: Fetch the annotated tag
        env:
          TAG: ${{ github.ref_name }}
        run: git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"

      - name: Check the release
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/ReleaseCheck/release_check.py "$TAG"

  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the whole history, so MinVer finds the last version tag
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test AuBtechReviewAgent.sln --configuration Release

  github-release:
    needs: [ check, test ]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the whole history, so MinVer finds the last version tag

      - name: Fetch the annotated tag
        env:
          TAG: ${{ github.ref_name }}
        run: git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"

      # GitHub's list of merged pull requests since the version before, which the body folds away at the end.
      # The previous version is the nearest version tag behind this one. Without it, or if GitHub cannot make the
      # list, the body simply has no list and no comparison link.
      - name: Find the version before and the merged pull requests
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" 2>/dev/null || true)
          echo "tag=${prev}" >> "$GITHUB_OUTPUT"
          args=(-f tag_name="$TAG")
          if [ -n "$prev" ]; then args+=(-f previous_tag_name="$prev"); fi
          gh api -X POST "repos/${REPO}/releases/generate-notes" "${args[@]}" --jq .body > generated-notes.md \
            || : > generated-notes.md

      # The same check again, which also writes the title and the body: the version's section of CHANGELOG.md with
      # a summary and a table on top, how to cite it, the folded list and the comparison link
      # (tools/ReleaseCheck/release_body.py).
      - name: Write the title and the body
        id: release
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          PREVIOUS: ${{ steps.previous.outputs.tag }}
        run: |
          python3 tools/ReleaseCheck/release_check.py "$TAG" --body-out release-body.md \
            --generated-notes generated-notes.md --previous-tag "$PREVIOUS" --repository "$REPO"

      # A version with a pre-release part (v0.2.0-rc.1) is marked as a pre-release.
      - name: Create the GitHub release (Zenodo archives it when the integration is on)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ steps.release.outputs.title }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --title "$TITLE" --notes-file release-body.md --verify-tag "${flags[@]}"

  # Deploying is the release's job: a merge into master does not deploy (#707). The server's build reads the tag, so
  # its version and its papers name the release (#144). A tag older than the newest version tag is never
  # deployed, because that would roll the server back; a merge that lands on master while this workflow runs
  # does not matter, since the tag's own commit is built. A pre-release tag (v0.2.0-rc.1) deploys when it is the
  # newest version.
  is-newest:
    name: Is the tag the newest version?
    needs: github-release
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.compare.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the whole history, with every version tag
      - id: compare
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/ReleaseCheck/newest_tag.py "$TAG"

  deploy:
    name: Deploy the release
    needs: is-newest
    if: needs.is-newest.outputs.deploy == 'true' && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets:
      SIMPLY_FTP_USER: ${{ secrets.SIMPLY_FTP_USER }}
      SIMPLY_FTP_PASSWORD: ${{ secrets.SIMPLY_FTP_PASSWORD }}

  # The Docker image is built from the Dockerfile and pushed to ghcr.io/lauphilip/au-btech-literature-review-agent
  # (#776). It carries no secret: the registry login uses the workflow's own token, and the app's keys are passed to
  # the container when it starts. Only this job may write packages; the workflow itself stays read-only. The version
  # tag is always pushed. `latest` moves only for a stable version that is the newest, so an older tag or a
  # pre-release (v0.2.0-rc.1) never takes it over.
  docker-image:
    name: Publish the Docker image
    needs: is-newest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push the image to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Name the image and its tags
        id: image
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NEWEST: ${{ needs.is-newest.outputs.deploy }}
        run: |
          image="ghcr.io/${REPO,,}"
          tags="${image}:${TAG#v}"
          if [ "$NEWEST" = "true" ] && [[ "$TAG" != *-* ]]; then tags+=$'\n'"${image}:latest"; fi
          echo "name=${image}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: APP_VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
