# Publishing a version: see "Publishing a version" in CONTRIBUTING.md. In short, after CHANGELOG.md and
# CITATION.cff name the version on master, push an annotated tag whose message is the release's title:
#   git tag -a v0.1.0 -m "Research questions" && git push origin v0.1.0
# The release is titled "v0.1.0 - Research questions". Its body is composed by tools/ReleaseCheck/release_body.py:
# a one-line summary, what the version means for your review, the version's section of CHANGELOG.md, how to cite
# it, GitHub's list of merged pull requests folded away and the link comparing it with the previous release.
# tools/ReleaseCheck/release_check.py stops the release, with the reason, if the tag is not a version or has no
# message, if CHANGELOG.md has no section for it, if CITATION.cff's version or date-released does not match, or if
# the notes score below 60 for Flesch Reading Ease or do not have exactly one emoji.
# Once the release is published, the tagged commit is deployed to the server through deploy.yml, if it is still
# master's newest commit, so the server's build names the release (#144).
# (The Dockerfile is not built here: the app is deployed to Simply as a .NET app.) When the repository is linked
# to Zenodo (zenodo.org -> GitHub -> switch the repository on), every GitHub release is archived there with its
# own DOI, using the metadata in .zenodo.json.
name: Release

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: read

jobs:
  check:
    name: Check the tag, changelog and citation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the whole history, so MinVer finds the last version tag

      # The checkout can leave the tag as a plain pointer to the commit; fetching it again by name keeps the
      # annotated tag, with its message and date, which the title and the citation check need.
      - name: Fetch the annotated tag
        env:
          TAG: ${{ github.ref_name }}
        run: git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"

      - name: Check the release
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/ReleaseCheck/release_check.py "$TAG"

  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the whole history, so MinVer finds the last version tag
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test AuBtechReviewAgent.sln --configuration Release

  github-release:
    needs: [ check, test ]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the whole history, so MinVer finds the last version tag

      - name: Fetch the annotated tag
        env:
          TAG: ${{ github.ref_name }}
        run: git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"

      # GitHub's list of merged pull requests since the version before, which the body folds away at the end.
      # The previous version is the nearest version tag behind this one. Without it, or if GitHub cannot make the
      # list, the body simply has no list and no comparison link.
      - name: Find the version before and the merged pull requests
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" 2>/dev/null || true)
          echo "tag=${prev}" >> "$GITHUB_OUTPUT"
          args=(-f tag_name="$TAG")
          if [ -n "$prev" ]; then args+=(-f previous_tag_name="$prev"); fi
          gh api -X POST "repos/${REPO}/releases/generate-notes" "${args[@]}" --jq .body > generated-notes.md \
            || : > generated-notes.md

      # The same check again, which also writes the title and the body: the version's section of CHANGELOG.md with
      # a summary and a table on top, how to cite it, the folded list and the comparison link
      # (tools/ReleaseCheck/release_body.py).
      - name: Write the title and the body
        id: release
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          PREVIOUS: ${{ steps.previous.outputs.tag }}
        run: |
          python3 tools/ReleaseCheck/release_check.py "$TAG" --body-out release-body.md \
            --generated-notes generated-notes.md --previous-tag "$PREVIOUS" --repository "$REPO"

      # A version with a pre-release part (v0.2.0-rc.1) is marked as a pre-release.
      - name: Create the GitHub release (Zenodo archives it when the integration is on)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ steps.release.outputs.title }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --title "$TITLE" --notes-file release-body.md --verify-tag "${flags[@]}"

  # The deploy on the push to master ran before this tag existed, so the server names itself a pre-release
  # (0.2.1-alpha.0.1, "not a published release") until it is built again from the tag (#144). This deploys the
  # tagged commit once the release is published, so the server's version and its papers name the release.
  # A tag on an older commit is never deployed: that would roll the server back behind master.
  is-master-head:
    name: Is the tag master's newest commit?
    needs: github-release
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.compare.outputs.deploy }}
    steps:
      - id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # commits/<tag> gives the commit an annotated tag points to, not the tag object.
          tag_sha=$(gh api "repos/${REPO}/commits/${TAG}" --jq .sha)
          master=$(gh api "repos/${REPO}/commits/master" --jq .sha)
          if [ "$master" = "$tag_sha" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "The tag is on master's newest commit ${master}; deploying the release."
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not deployed: ${TAG} is on ${tag_sha}, but master is at ${master}. The server keeps the newer build."
          fi

  deploy:
    name: Deploy the release
    needs: is-master-head
    if: needs.is-master-head.outputs.deploy == 'true' && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets:
      SIMPLY_FTP_USER: ${{ secrets.SIMPLY_FTP_USER }}
      SIMPLY_FTP_PASSWORD: ${{ secrets.SIMPLY_FTP_PASSWORD }}
