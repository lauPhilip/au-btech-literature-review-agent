name: CodeQL

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '23 4 * * 1'   # Mondays 04:23 UTC

permissions:
  contents: read

# A newer push to a pull request cancels the older run; pushes to master and the weekly run each have their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request that changes docs alone is not analysed (tools/test-scope.sh prints NONE); the skipped job still
  # reports. Pushes to master and the weekly run are always analysed.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the pull request's base commit, to compare with
      - name: Is it docs only?
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          if [ "${{ github.event_name }}" = pull_request ] && [ "$(bash tools/test-scope.sh "$BASE...HEAD")" = NONE ]; then code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          # Vendored third-party files (Bootstrap, Mermaid) and generated CSS are not our code.
          config: |
            paths-ignore:
              - AuBtechReviewAgent/wwwroot/lib
              - AuBtechReviewAgent/wwwroot/css
            # Style suggestions we have decided against, so they do not bury real findings:
            # - catch-of-all-exceptions: a run must survive any failure in one paper, source or file write;
            #   those catches are deliberate, and each one logs or records the failure in the ledger.
            # - missed-where / missed-select: "use LINQ instead of this foreach" is a style preference.
            query-filters:
              - exclude:
                  id: cs/catch-of-all-exceptions
              - exclude:
                  id: cs/linq/missed-where
              - exclude:
                  id: cs/linq/missed-select

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
