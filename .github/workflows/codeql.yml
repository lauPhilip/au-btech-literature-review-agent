name: CodeQL

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '23 4 * * 1'   # Mondays 04:23 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          # Vendored third-party files (Bootstrap, Mermaid) and generated CSS are not our code.
          config: |
            paths-ignore:
              - AuBtechReviewAgent/wwwroot/lib
              - AuBtechReviewAgent/wwwroot/css
            # Style suggestions we have decided against, so they do not bury real findings:
            # - catch-of-all-exceptions: a run must survive any failure in one paper, source or file write;
            #   those catches are deliberate, and each one logs or records the failure in the ledger.
            # - missed-where / missed-select: "use LINQ instead of this foreach" is a style preference.
            query-filters:
              - exclude:
                  id: cs/catch-of-all-exceptions
              - exclude:
                  id: cs/linq/missed-where
              - exclude:
                  id: cs/linq/missed-select

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
