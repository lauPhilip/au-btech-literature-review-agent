# Deploys the app to Simply. It is called, never run on its own:
#   - by release.yml once a version's GitHub release is published and the tag is the newest version tag, so the
#     build on the server reads the tag and its papers name the release (v0.2.1) and not a pre-release
#     (0.2.1-alpha.0.1). See #144 and #707;
#   - by deploy-manual.yml, which Lau starts by hand to ship master's newest commit before the next release.
# A merge into master does not deploy. The callers decide whether to deploy (DEPLOY_ENABLED, and for a release
# whether the tag is the newest version). Every deploy waits for the one before it, across both workflows
# (concurrency group deploy-simply), and always runs: there is no skip for a change that touched only documentation.
# Taking the site offline stops every running review, so the "wait" job first waits until none is running
# (deploy/site_health.py, tested in tools/ReleaseCheck/test_site_health.py). See docs/wiki/06, "Deployment".
name: Deploy

on:
  workflow_call:
    inputs:
      wait-minutes:
        description: How long to wait for running reviews before deploying anyway (the repository variable DEPLOY_WAIT_MINUTES wins)
        type: number
        default: 150
    secrets:
      SIMPLY_FTP_USER:
        required: true
      SIMPLY_FTP_PASSWORD:
        required: true

permissions:
  contents: read

env:
  HEALTH_URL: ${{ vars.SITE_HEALTH_URL || 'https://au-btech-literature-review-agent.dk/health' }}

jobs:
  # Waits until no review is running. Nothing has changed on the server yet, so a
  # newer deploy may cancel this one while it waits (cancel-in-progress): only the newest commit is deployed.
  # A run longer than the limit is stopped by the deploy rather than holding back a merged fix.
  wait:
    name: Wait for running reviews
    runs-on: ubuntu-latest
    timeout-minutes: 200   # the wait limit (150 min) and some room; GitHub's own limit is 6 h
    concurrency:
      group: deploy-simply-wait
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # to compare the site's commit with this one

      - name: Wait until no review is running
        env:
          WAIT_MINUTES: ${{ vars.DEPLOY_WAIT_MINUTES || inputs.wait-minutes }}
        run: python3 deploy/site_health.py wait-idle "$HEALTH_URL" --minutes "$WAIT_MINUTES"

  deploy:
    name: Deploy to Simply
    needs: wait
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Never run two deploys at the same time; a newer push waits for the running one.
    concurrency:
      group: deploy-simply
      cancel-in-progress: false
    env:
      # Simply.com ASP hosting is Windows/IIS with only .NET Framework installed, so the app is published
      # self-contained for win-x86, and reaches the server over FTPS (SSH exists only on Simply's PHP hosting).
      FTP_HOST: ${{ vars.SIMPLY_FTP_HOST || 'ftp.simply.com' }}
      REMOTE_DIR: ${{ vars.SIMPLY_REMOTE_DIR || '/public_html' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the whole history, so MinVer finds the last version tag

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish (self-contained, win-x86)
        run: |
          # MinVer names the build from the nearest tag: on a tagged commit it is that release (v0.2.1).
          echo "Nearest tag: $(git describe --tags --always)"
          dotnet publish AuBtechReviewAgent/AuBtechReviewAgent.csproj --configuration Release \
            --runtime win-x86 --self-contained true -o ./publish
          # The server keeps its own web.config, which holds the API keys; never overwrite it.
          rm -f ./publish/web.config
          # The "we're updating" page shown while files are uploaded (self-contained, see deploy/app_offline.htm).
          cp deploy/app_offline.htm app_offline.htm

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # This job may have queued behind another deploy, or reviews may have started since the wait job; look once
      # more, right before the site goes offline. A review started in the seconds after this check is still stopped.
      - name: Check again that no review is running
        run: python3 deploy/site_health.py wait-idle "$HEALTH_URL" --minutes 30

      # Add these repository secrets (Settings -> Secrets and variables -> Actions -> Secrets):
      #   SIMPLY_FTP_USER      - the FTP username from the Simply.com control panel
      #   SIMPLY_FTP_PASSWORD  - its password
      # 1) app_offline.htm stops the app so its files are not locked; 2) the new files are uploaded
      # (web.config, App_Data and WorkspaceStore on the server are left alone, and nothing is deleted there);
      # 3) every file is checked on the server; 4) app_offline.htm is removed, which starts the new version.
      # If any step fails, the site stays on the "Updating" page rather than running a half-updated app;
      # re-run the job or remove the file by FTP.
      # lftp goes on after a failed command unless told otherwise, so cmd:fail-exit stops the script (and fails the
      # job) at the first error; without it a broken upload still removed app_offline.htm and started a half-updated
      # app (HTTP 502.5). The pause after app_offline.htm gives IIS time to stop the app and release its files.
      # --transfer-all uploads every file of the build. Without it the mirror skips a file whose copy on the server
      # has the same size and a newer date, and the .NET runtime files carry their package's old date: after a
      # build with another .NET patch was uploaded by hand, the server kept a mix of two runtimes (HTTP 502.5).
      - name: Upload to Simply over FTPS
        env:
          LFTP_PASSWORD: ${{ secrets.SIMPLY_FTP_PASSWORD }}
          FTP_USER: ${{ secrets.SIMPLY_FTP_USER }}
        run: |
          lftp -c "
            set cmd:fail-exit yes;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            set net:timeout 30;
            open --env-password -u \"$FTP_USER\" \"$FTP_HOST\";
            cd \"$REMOTE_DIR\";
            put app_offline.htm;
            sleep 15;
            mirror --reverse --transfer-all --parallel=2 --verbose=1 --no-perms \
              --exclude-glob web.config --exclude-glob App_Data/ --exclude-glob WorkspaceStore/ \
              ./publish .
          "

      # The mirror skips files it takes to be unchanged, and once left empty runtime files on the server that
      # every later deploy kept (HTTP 502.5, 15 October 2026). This asks the server for the size of every file of
      # the build, uploads again any that is missing or differs, and fails the job if one still differs.
      - name: Check every file on the server
        env:
          LFTP_PASSWORD: ${{ secrets.SIMPLY_FTP_PASSWORD }}
          FTP_USER: ${{ secrets.SIMPLY_FTP_USER }}
        run: python3 deploy/verify-upload.py ./publish

      - name: Start the new version
        env:
          LFTP_PASSWORD: ${{ secrets.SIMPLY_FTP_PASSWORD }}
          FTP_USER: ${{ secrets.SIMPLY_FTP_USER }}
        run: |
          lftp -c "
            set cmd:fail-exit yes;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            open --env-password -u \"$FTP_USER\" \"$FTP_HOST\";
            cd \"$REMOTE_DIR\";
            rm app_offline.htm
          "

      # IIS starts the app on the first request. Until /health answers 200 with this commit, the deploy is not done:
      # a version that does not start (HTTP 502.5) fails the job here, so it is seen at once.
      - name: Check that the new version started
        run: python3 deploy/site_health.py wait-started "$HEALTH_URL" "$GITHUB_SHA" --minutes 5
